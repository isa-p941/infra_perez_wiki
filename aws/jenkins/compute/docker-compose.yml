services:
  jenkins:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc/jenkins.yaml
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      LINODE_HOST: "${LINODE_HOST}"
    # host docker group, so the jenkins user can use the mounted socket
    group_add:
      - "${DOCKER_GID}"
    volumes:
      # Host path == container path on purpose: Jenkins starts sibling
      # containers through the host's docker socket, and their `.:/app`
      # bind mounts are resolved by the HOST daemon. A named volume would
      # leave those mounts empty (the workspace path wouldn't exist on the host).
      - /var/jenkins_home:/var/jenkins_home
      - ./jcasc/jenkins.yaml:/var/jenkins_home/casc/jenkins.yaml:ro
      - /opt/jenkins/secrets:/run/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      bash -c "export ADMIN_PASSWORD=$$(cat /run/secrets/admin_password) &&
      export LINODE_SSH_KEY=$$(cat /run/secrets/linode_ssh_key) &&
      jenkins-plugin-cli --plugins docker-plugin docker-workflow git
      ssh-agent configuration-as-code workflow-aggregator matrix-auth job-dsl &&
      /usr/local/bin/jenkins.sh"

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /opt/jenkins/exporter-config:/etc/node-exporter:ro
    command:
      - "--web.config.file=/etc/node-exporter/web-config.yml"
